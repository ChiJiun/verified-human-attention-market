name: CI

on:
  pull_request:
  # All branches: changes are verified on the branch before main is updated.
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vham_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vham_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vham_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Format check
        run: pnpm format:check

  solidity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4

      - name: Forge format check
        run: |
          forge fmt --check 2>&1 | tee forge-fmt.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            head -60 forge-fmt.log | sed 's/^/::error::/'
          fi
          exit "$status"

      - name: Forge build
        # Compiler errors are re-emitted as annotations (readable via the API).
        run: |
          forge build --sizes 2>&1 | tee forge-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E -A6 "^Error|error\[" forge-build.log | head -60 | sed 's/^/::error::/'
          fi
          exit "$status"

      - name: Check shared ABI is up to date
        run: node scripts/export-abi.mjs --check

      - name: Forge test
        run: |
          forge test -vv 2>&1 | tee forge-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E -A4 "\[FAIL|Error|error\[" forge-test.log | head -60 | sed 's/^/::error::/'
          fi
          exit "$status"
