name: CI

on:
  pull_request:
  # All branches: changes are verified on the branch before main is updated.
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vham_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vham_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vham_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        # Failures are re-emitted as annotations (readable via the API).
        run: |
          pnpm test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # One annotation per failed test (GitHub keeps 10 per step).
            python3 - <<'PY'
          import re
          lines = open("test.log", encoding="utf-8", errors="replace").read().splitlines()
          lines = [re.sub(r"^\S+ test: ", "", line) for line in lines]
          blocks, current = [], None
          for line in lines:
              if re.match(r"\s*FAIL\s", line):
                  current = [line.strip()]
                  blocks.append(current)
              elif current is not None and len(current) < 25:
                  current.append(line.rstrip())
          if not blocks:
              blocks = [lines[-40:]]
          for block in blocks[:9]:
              print("::error::" + "%0A".join(block)[:4000])
          PY
          fi
          exit "$status"

      - name: Build
        run: pnpm build

      - name: Format check
        run: |
          pnpm format:check 2>&1 | tee format.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            sed 's/\x1b\[[0-9;]*m//g' format.log | grep -v "^>" | tail -9 | sed 's/^/::error::/'
            pnpm exec prettier --write . > /dev/null
            echo "::error::$(git diff | head -80 | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          exit "$status"

  e2e:
    # Local-chain end-to-end POC (issue #13): real contracts on anvil, real
    # API + PostgreSQL; only World ID is simulated.
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vham_e2e
      E2E_RPC_URL: http://127.0.0.1:8545
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vham_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vham_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4

      - name: Build contracts
        working-directory: packages/contracts
        run: forge build

      - name: Start anvil
        run: |
          anvil --silent > anvil.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf -X POST -H "content-type: application/json" \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
              "$E2E_RPC_URL" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::anvil did not start"
          exit 1

      - name: End-to-end POC
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        run: |
          pnpm --filter @vham/api test:e2e 2>&1 | tee e2e.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            python3 - <<'PY'
          import re
          lines = open("e2e.log", encoding="utf-8", errors="replace").read().splitlines()
          blocks, current = [], None
          for line in lines:
              if re.search(r"FAIL|Error|AssertionError|expected", line):
                  current = [line.strip()]
                  blocks.append(current)
              elif current is not None and len(current) < 25:
                  current.append(line.rstrip())
          if not blocks:
              blocks = [lines[-40:]]
          for block in blocks[:9]:
              print("::error::" + "%0A".join(block)[:4000])
          PY
          fi
          exit "$status"

  solidity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4

      - name: Forge format check
        run: |
          forge fmt --check 2>&1 | tee forge-fmt.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            head -60 forge-fmt.log | sed 's/^/::error::/'
          fi
          exit "$status"

      - name: Forge build
        # Compiler errors are re-emitted as annotations (readable via the API).
        run: |
          forge build --sizes 2>&1 | tee forge-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E -A6 "^Error|error\[" forge-build.log | head -60 | sed 's/^/::error::/'
          fi
          exit "$status"

      - name: Check shared ABI is up to date
        run: node scripts/export-abi.mjs --check

      - name: Forge test
        run: |
          forge test -vv 2>&1 | tee forge-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E -A4 "\[FAIL|Error|error\[" forge-test.log | head -60 | sed 's/^/::error::/'
          fi
          exit "$status"
