name: CI

on:
  pull_request:
  # All branches: changes are verified on the branch before main is updated.
  push:
    branches:
      - "**"

permissions:
  contents: read

env:
  # The one Foundry release every job installs. Deliberately not FOUNDRY_*:
  # forge reads each FOUNDRY_<KEY> variable as a config override.
  CI_FOUNDRY_VERSION: v1.8.4

jobs:
  javascript:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vham_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vham_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vham_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        # Installs the version in package.json "packageManager".
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        # Failures become annotations (readable via the API). The source is the
        # vitest github-actions reporter (see the vitest configs): one
        # "::error file=..." line per failed test, at its file and line. The
        # runner only reads a line that starts with "::" as a command, and
        # pnpm -r starts each line of a package's output with
        # "<package dir> test: ", so the reporter lines are printed again
        # without that prefix (a line that has no prefix was already read).
        # When the reporter wrote no line (vitest stopped before reporting, or
        # no error had a frame in the project), the last 40 log lines become
        # one annotation instead, cut to their last 4000 characters.
        run: |
          pnpm test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          sed -En 's/^[^ ]+ [^ ]+: (::error file=)/\1/p' test.log
          if [ "$status" -ne 0 ] && ! grep -Eq '^([^ ]+ [^ ]+: )?::error file=' test.log; then
            tail -40 test.log | sed 's/%/%25/g; s/\r//g' | awk '
              { msg = msg (NR > 1 ? "%0A" : "") $0 }
              END { if (NR) print "::error::" substr(msg, length(msg) > 4000 ? length(msg) - 3999 : 1) }'
          fi
          exit "$status"

      - name: Build
        run: pnpm build

      - name: CSP smoke
        run: pnpm --filter @vham/web smoke:csp

      - name: X-Forwarded-For smoke
        run: pnpm --filter @vham/web smoke:forwarded-for

      - name: Format check
        run: |
          pnpm format:check 2>&1 | tee format.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            sed 's/\x1b\[[0-9;]*m//g' format.log | grep -v "^>" | tail -9 | sed 's/^/::error::/'
            pnpm exec prettier --write . > /dev/null
            echo "::error::$(git diff | head -80 | sed ':a;N;$!ba;s/\n/%0A/g')"
          fi
          exit "$status"

  e2e:
    # Local-chain end-to-end POC (issue #13): real contracts on anvil, real
    # API + PostgreSQL; only World ID is simulated.
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vham_e2e
      E2E_RPC_URL: http://127.0.0.1:8545
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vham_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vham_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        # Installs the version in package.json "packageManager".
        uses: pnpm/action-setup@v5
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.CI_FOUNDRY_VERSION }}

      - name: Build contracts
        working-directory: packages/contracts
        run: forge build

      - name: Start anvil
        run: |
          anvil --silent > anvil.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -sf -X POST -H "content-type: application/json" \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
              "$E2E_RPC_URL" > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::anvil did not start"
          exit 1

      - name: End-to-end POC
        env:
          NO_COLOR: "1"
          FORCE_COLOR: "0"
        # Annotated like the javascript Test step: the vitest reporter
        # (vitest.e2e.config.ts), else the end of the log. With one package,
        # pnpm does not prefix the lines today, so nothing is printed again.
        run: |
          pnpm --filter @vham/api test:e2e 2>&1 | tee e2e.log
          status=${PIPESTATUS[0]}
          sed -En 's/^[^ ]+ [^ ]+: (::error file=)/\1/p' e2e.log
          if [ "$status" -ne 0 ] && ! grep -Eq '^([^ ]+ [^ ]+: )?::error file=' e2e.log; then
            tail -40 e2e.log | sed 's/%/%25/g; s/\r//g' | awk '
              { msg = msg (NR > 1 ? "%0A" : "") $0 }
              END { if (NR) print "::error::" substr(msg, length(msg) > 4000 ? length(msg) - 3999 : 1) }'
          fi
          exit "$status"

      # Production-readiness drill (#29): the database the e2e run just
      # filled must survive pg_dump → pg_restore unchanged.
      - name: Backup and restore drill
        env:
          PG_TOOLS: docker run --rm -i --network host postgres:16-alpine
        run: scripts/db/backup-restore-check.sh "$TEST_DATABASE_URL"

  solidity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.CI_FOUNDRY_VERSION }}

      - name: Forge format check
        run: |
          forge fmt --check 2>&1 | tee forge-fmt.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            head -60 forge-fmt.log | sed 's/^/::error::/'
          fi
          exit "$status"

      - name: Forge build
        # Compiler errors are re-emitted as annotations (readable via the API).
        run: |
          forge build --sizes 2>&1 | tee forge-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E -A6 "^Error|error\[" forge-build.log | head -60 | sed 's/^/::error::/'
          fi
          exit "$status"

      - name: Check shared ABI is up to date
        run: node scripts/export-abi.mjs --check

      - name: Forge test
        run: |
          forge test -vv 2>&1 | tee forge-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E -A4 "\[FAIL|Error|error\[" forge-test.log | head -60 | sed 's/^/::error::/'
          fi
          exit "$status"
